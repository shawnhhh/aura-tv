name: HERRIN Real FanTaiYing Nodes and ARM Translation
on:
  push:
    branches: ['codex/herrin-live-node-simulation-20261110']
    paths:
      - 'android-tv/**'
      - '.github/workflows/herrin-fantaiying-real-nodes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-nodes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: tv-x86_64
            target: android-tv
            profile: tv_1080p
            arm_package: 'false'
          - mode: google-x86_64
            target: google_apis
            profile: pixel_2
            arm_package: 'false'
          - mode: google-arm-package
            target: google_apis
            profile: pixel_2
            arm_package: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure NDK for original ARM JNI probe
        run: |
          if ! test -d "$ANDROID_HOME/ndk"; then
            sdkmanager 'ndk;27.2.12479018'
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ARM_PACKAGE: ${{ matrix.arm_package }}
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android-tv/scripts/run_live_nodes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-nodes-${{ matrix.mode }}
          path: evidence/
          retention-days: 14
