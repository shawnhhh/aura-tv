name: HERRIN Android Debug
on:
  push:
    branches: ['integration/herrin-m437-consumer-tv-20261029', 'feat/herrin-android-tv-m1', 'feat/herrin-m1-5-cinematic', 'feat/herrin-m2-provider-player', 'feat/herrin-m2-2-episode-resume', 'feat/herrin-m2-3-player-controls', 'feat/herrin-m4-5-catvod-spider-playback-20261027']
    paths: ['android-tv/**', '.github/workflows/android-debug.yml']
  pull_request:
    paths: ['android-tv/**', '.github/workflows/android-debug.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    # P0 pushes use the serial caller, including when its PR becomes mergeable.
    if: github.event_name != 'pull_request' || (github.head_ref != 'codex/m471-tmdb-personal-to-tvbox-playback-20261102' && github.head_ref != 'codex/herrin-responsive-config-20261106' && github.head_ref != 'codex/herrin-startup-source-health-20261107')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Offline structural checks
        run: |
          python3 scripts/check_static.py
          python3 -m unittest discover -s scripts -p 'test_check_playback_boundary.py' -v
      - name: Native integration boundary regression (offline)
        run: python3 -m unittest discover -s ../scripts/m467 -p 'test_verify_native_kit.py' -v
      - name: Native candidate build script syntax (offline)
        run: bash -n ../scripts/m467/build_native_candidates.sh
      - name: Install Android SDK
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdk_manager"
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and assemble Debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Generate Chinese acceptance record
        if: always()
        run: python3 scripts/acceptance_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: HERRIN-debug-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HERRIN-test-reports
          path: |
            android-tv/app/build/reports/
            android-tv/build/acceptance/
          if-no-files-found: ignore
