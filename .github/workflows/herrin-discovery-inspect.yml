name: HERRIN Discovery Controlled Evidence Inspection
on:
  push:
    branches: ['codex/herrin-discovery-evidence-20261108']
    paths: ['.github/workflows/herrin-discovery-inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HERRIN-emulator-evidence
          github-token: ${{ github.token }}
          run-id: 42435249433
          path: evidence
      - name: Read retained decoder lifecycle and input focus evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          shown=0
          for path in Path('evidence').rglob('logcat.txt'):
              for row in path.read_text(errors='replace').splitlines():
                  if not any(tag in row for tag in ['HerrinDecoder', 'MediaDecoderTest', 'INJECT_EVENTS', 'injectInputEvent', 'InputDispatcher', 'ActivityTaskManager', 'WindowManager']):continue
                  if not any(stamp in row for stamp in ['01:52:4','01:52:5']):continue
                  row=re.sub(r'https?://[^\s\]<>]+','<url>',row)
                  print(row[:1200]);shown+=1
                  if shown>=180:break
          print('PUBLIC_FIXTURE_ROWS',shown)
          PY
