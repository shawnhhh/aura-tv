name: HERRIN pinned FongMi native candidate source build

on:
  push:
    branches: [codex/herrin-p0-live-playback-20261110]
    paths: [.github/workflows/herrin-fongmi-native-source-build.yml]
  # The locked FongMi/media candidate has been built and proven ABI-incompatible
  # with the original TV@305dff2. Do not waste an expensive native build on
  # every workflow edit; opt in only after the source revision actually changes.
  workflow_dispatch:
    inputs:
      build_original_bridge_adapter:
        type: boolean
        default: false
        description: 'Build original hook/tvbus and attempt adapter; never playback acceptance'
  workflow_call:
    inputs:
      build_original_bridge_adapter:
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  upstream-native:
    if: github.event_name == 'workflow_dispatch' && inputs.build_original_bridge_adapter != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate native artifact collector and compatibility fixture tests
        run: |
          PYTHONPATH=android-tv/fongmi-kernel python3 -m unittest discover \
            -s android-tv/fongmi-kernel/tests -p 'test_native_candidate.py' -v
          python3 -m py_compile android-tv/fongmi-kernel/collect_native_candidate.py \
            android-tv/fongmi-kernel/verify_native_candidate.py
      - name: Checkout exact public FongMi/media native source
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: vendor-media
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Cache only: the checked-out upstream wrapper selects Gradle 9.1.0.
      # Do not hand-code an abbreviated version unsupported by setup-gradle.
      - uses: gradle/actions/setup-gradle@v4
      - name: Prove native source identity and real ARM32/ARM64 inputs
        run: |
          test "$(git -C vendor-media rev-parse HEAD)" = 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          for abi in arm64-v8a armeabi-v7a; do
            test -s "vendor-media/libraries/mpvplayer/src/main/jniLibs/$abi/libmpv.so"
            test -s "vendor-media/libraries/mpvplayer/src/main/jniLibs/$abi/libplayer.so"
            test -s "vendor-media/libraries/decoder_ffmpeg/src/main/jniLibs/$abi/libavcodec.so"
            test -s "vendor-media/libraries/decoder_ffmpeg/src/main/jniLibs/$abi/libavformat.so"
          done
      - name: Build upstream MPV and FFmpeg release AAR candidates (no Herrin APK)
        working-directory: vendor-media
        run: |
          ./gradlew :lib-decoder-ffmpeg:assembleRelease :lib-mpvplayer:assembleRelease \
            --no-daemon --max-workers=2 --console=plain
      - name: Collect real MPV and FFmpeg AARs from all upstream Gradle outputs
        run: |
          python3 android-tv/fongmi-kernel/collect_native_candidate.py \
            --source vendor-media --directory native-candidate
      - name: Check source-built ARM32/ARM64 ELF and exact original TV Java API
        run: |
          python3 android-tv/fongmi-kernel/verify_native_candidate.py \
            --directory native-candidate \
            --upstream android-tv/vendor/fongmi-core/upstream \
            --output native-candidate/provenance.json
      - name: Publish exact native candidate result (not playback acceptance)
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path('native-candidate/provenance.json')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Pinned FongMi native build — not playback acceptance\n\n')
              f.write('FongMi/media@3c2cbe8a was compiled from genuine source.\n\n')
              if report_path.is_file():
                  report = json.loads(report_path.read_text())
                  f.write('**Audit status:** ' + report['status'] + '\n\n')
                  for item in report['artifacts']:
                      f.write(item['module'] + ': SHA-256 ' + item['sha256'] + '\n\n')
                  if report['missing_original_tv_classes']:
                      f.write('**Missing original TV native classes:**\n\n')
                      for name in report['missing_original_tv_classes']:
                          f.write('- ' + name + '\n')
                      f.write('\n')
              else:
                  f.write('Native packaging/collection did not reach a completed audit.\n\n')
              f.write('Never install these candidates in Herrin until original TV API, license, and binary compatibility are proven.\n')
          PY
      - name: Preserve authentic native candidates for compatibility review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-built-fongmi-native-candidate-not-validated-for-herrin
          path: native-candidate/
          retention-days: 5

  original-bridges-and-adapter:
    if: inputs.build_original_bridge_adapter == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[original-bridge-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind pinned original build inputs and strict dependency status
        run: |
          mkdir -p bridge-adapter-evidence
          git rev-parse HEAD > bridge-adapter-evidence/SOURCE_COMMIT.txt
          test "$(git -C android-tv/vendor/fongmi-core/upstream rev-parse HEAD)" = 305dff233cde512e2c83f71529b7c3ecfd61fefc
          python3 android-tv/fongmi-kernel/verify_dependencies.py --directory android-tv/fongmi-kernel/unresolved-libraries --report > bridge-adapter-evidence/dependencies.json
          printf '%s\n' 'Original pinned wrapper/catalog only. No host APK, substituted AAR, provider authorization or playback acceptance.' > bridge-adapter-evidence/VERIFICATION_SCOPE.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the SDK declared by the pinned original catalog
        run: |
          sdk=$(python3 -c 'import tomllib; print(tomllib.load(open("android-tv/vendor/fongmi-core/upstream/gradle/libs.versions.toml","rb"))["versions"]["compileSdk"])')
          sdkmanager "platforms;android-$sdk"
      - name: Compile original hook and tvbus source modules with their own wrapper
        run: |
          set -o pipefail
          bash android-tv/vendor/fongmi-core/upstream/gradlew -p android-tv/fongmi-kernel \
            :hook:bundleDebugAar :tvbus:bundleDebugAar \
            --no-daemon --max-workers=1 --console=plain 2>&1 | tee bridge-adapter-evidence/original-bridges-build.log
      - name: Attempt independent adapter compilation without weakening the dependency gate
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bash android-tv/vendor/fongmi-core/upstream/gradlew -p android-tv/fongmi-kernel \
            :adapter:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --console=plain 2>&1 | tee bridge-adapter-evidence/original-adapter-build.log
      - name: Preserve genuine outputs and build failures (not verified kernel inputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-fongmi-bridge-adapter-build-not-playback-acceptance
          path: |
            bridge-adapter-evidence/
            android-tv/vendor/fongmi-core/upstream/hook/build/outputs/aar/
            android-tv/vendor/fongmi-core/upstream/tvbus/build/outputs/aar/
          retention-days: 14
