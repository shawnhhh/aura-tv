name: HERRIN Android 12 Startup Compatibility
on: workflow_call
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: HERRIN-debug-apk
          path: startup-apk
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 12 platform splash handoff (phone image, landscape TV-sized viewport)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android-tv/scripts/startup_probe.sh startup-apk/app-debug.apk android-tv/build/startup-api31
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HERRIN-API31-startup-evidence
          path: android-tv/build/startup-api31/
          if-no-files-found: warn
          retention-days: 14
