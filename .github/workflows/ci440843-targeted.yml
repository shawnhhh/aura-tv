name: HERRIN CI440843 Targeted 13
on:
  push:
    branches: ['codex/herrin-ci13-validation-20261117']
permissions:
  contents: read
concurrency:
  group: herrin-ci440843-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild original test-only Spider fixture
        run: python3 android-tv/scripts/build_m467_spider_fixture.py
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute only the 13 failed methods on Android TV API30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HERRIN_GRADLE: gradle
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android-tv/scripts/ci440843_device.sh
      - name: Preserve targeted evidence, never publish acceptance APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci440843-targeted-evidence
          path: |
            android-tv/app/build/outputs/androidTest-results/
            android-tv/app/build/reports/androidTests/
            android-tv/build/ci440843-targeted-logcat.txt
          if-no-files-found: warn
