name: HERRIN FanTaiYing Real Warehouse Import
on:
  push:
    branches: ['codex/herrin-global-search-20261107']
    paths:
      - 'android-tv/app/src/liveAndroidTest/java/tv/herrin/app/FanTaiYingRealImportTest.kt'
      - '.github/workflows/herrin-fantaiying-real-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Runner DNS and real HTTP diagnostics (not import acceptance)
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, socket, time, urllib.request, urllib.error
          from pathlib import Path
          host = 'www.饭太硬.net'.encode('idna').decode()
          result = {'host': host, 'http_status': None}
          try:
              result['dns'] = sorted({x[4][0] for x in socket.getaddrinfo(host,80,type=socket.SOCK_STREAM)})
          except OSError as e:
              result['dns_error'] = str(e)
          begin = time.monotonic()
          try:
              with urllib.request.urlopen('http://'+host+'/tv', timeout=20) as r:
                  result['http_status'] = r.status
                  result['bytes_read'] = len(r.read(1048577))
          except urllib.error.HTTPError as e:
              result['http_status'] = e.code
              result['error_body_prefix'] = e.read(200).decode(errors='replace')
          except OSError as e:
              result['network_error'] = str(e)
          result['elapsed_ms'] = round((time.monotonic()-begin)*1000)
          Path('evidence/runner-network.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Production import path on TV (only real import test, no mocks)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android-tv/scripts/run_fantaiying_real_import.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HERRIN-fantaiying-real-import
          path: evidence/
          retention-days: 14
