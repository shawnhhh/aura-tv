name: Herrin Apple M0 Build

on:
  push:
    branches:
      - 'feat/herrin-apple-*'
    paths:
      - 'apple/**'
      - '.github/workflows/herrin-apple-m0-build.yml'
  pull_request:
    paths:
      - 'apple/**'
      - '.github/workflows/herrin-apple-m0-build.yml'
  workflow_dispatch:

jobs:
  build-apple:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apple
          xcodegen generate
      - name: Build iPhone + iPad simulator
        run: |
          xcodebuild -quiet -project apple/HerrinApple.xcodeproj -scheme HerrinAppleIOS \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build native macOS app
        run: |
          xcodebuild -quiet -project apple/HerrinApple.xcodeproj -scheme HerrinAppleMac \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
