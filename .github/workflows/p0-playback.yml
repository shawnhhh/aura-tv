name: HERRIN P0 Serial Verification
on:
  push:
    branches: ['codex/herrin-p0-live-playback-20261110', 'codex/m471-tmdb-personal-to-tvbox-playback-20261102', 'codex/herrin-responsive-config-20261106', 'codex/herrin-startup-source-health-20261107']
    paths:
      - 'android-tv/**'
      - '!android-tv/docs/**'
      - '.github/workflows/android-debug.yml'
      - '.github/workflows/android-emulator.yml'
      - '.github/workflows/p0-playback.yml'
      - '.github/workflows/android-startup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-playback-${{ github.ref }}-${{ github.ref == 'refs/heads/codex/herrin-startup-source-health-20261107' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/codex/herrin-p0-live-playback-20261110' || github.ref == 'refs/heads/codex/herrin-responsive-config-20261106' || github.ref == 'refs/heads/codex/herrin-startup-source-health-20261107' }}
jobs:
  verification-scope:
    runs-on: ubuntu-latest
    outputs:
      startup_only: ${{ steps.scope.outputs.startup_only }}
      abba_only: ${{ steps.scope.outputs.abba_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check verification reuse boundaries
        run: |
          python3 -m unittest discover -s .github/scripts -p test_p0_verification_scope.py -v
          python3 -m unittest discover -s android-tv/scripts -p test_check_startup_probe.py -v
      - id: scope
        run: python3 .github/scripts/p0_verification_scope.py
      - uses: actions/upload-artifact@v4
        with:
          name: HERRIN-verification-scope
          path: verification-scope.json
  debug:
    needs: verification-scope
    if: needs['verification-scope'].outputs.startup_only != 'true'
    uses: ./.github/workflows/android-debug.yml
  emulator:
    needs: [verification-scope, debug]
    if: ${{ !cancelled() && needs['verification-scope'].outputs.startup_only != 'true' && needs.debug.result == 'success' }}
    uses: ./.github/workflows/android-emulator.yml
  startup-api31:
    if: ${{ !cancelled() && needs['verification-scope'].outputs.abba_only != 'true' && (github.ref == 'refs/heads/codex/herrin-startup-source-health-20261107' || github.ref == 'refs/heads/codex/herrin-p0-live-playback-20261110') && (needs.emulator.result == 'success' || (needs['verification-scope'].outputs.startup_only == 'true' && needs.emulator.result == 'skipped')) }}
    needs: [verification-scope, emulator]
    uses: ./.github/workflows/android-startup.yml
  tmdb-abba:
    if: ${{ !cancelled() && github.ref == 'refs/heads/codex/herrin-p0-live-playback-20261110' && (needs['startup-api31'].result == 'success' || (needs['verification-scope'].outputs.abba_only == 'true' && needs['startup-api31'].result == 'skipped')) }}
    needs: [verification-scope, startup-api31]
    uses: ./.github/workflows/tmdb-browse-performance.yml
