name: HERRIN P0 Serial Verification
on:
  push:
    branches: ['codex/m471-tmdb-personal-to-tvbox-playback-20261102', 'codex/herrin-responsive-config-20261106', 'codex/herrin-startup-source-health-20261107']
    paths:
      - 'android-tv/**'
      - '!android-tv/docs/**'
      - '.github/workflows/android-debug.yml'
      - '.github/workflows/android-emulator.yml'
      - '.github/workflows/p0-playback.yml'
      - '.github/workflows/android-startup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-playback-${{ github.ref }}-${{ github.ref == 'refs/heads/codex/herrin-startup-source-health-20261107' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/codex/herrin-responsive-config-20261106' || github.ref == 'refs/heads/codex/herrin-startup-source-health-20261107' }}
jobs:
  debug:
    uses: ./.github/workflows/android-debug.yml
  emulator:
    needs: debug
    uses: ./.github/workflows/android-emulator.yml
  startup-api31:
    if: github.ref == 'refs/heads/codex/herrin-startup-source-health-20261107'
    needs: debug
    uses: ./.github/workflows/android-startup.yml
