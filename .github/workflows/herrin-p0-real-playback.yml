name: HERRIN P0 Real Playback Repair (one node)
on:
  push:
    branches: ['codex/herrin-p0-live-playback-20261110']
    paths: ['android-tv/**', '.github/workflows/herrin-p0-real-playback.yml']
  workflow_dispatch:
    inputs:
      node:
        type: choice
        options: [cheese, wanou]
        default: cheese
permissions:
  contents: read
concurrency:
  group: herrin-p0-live-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[tmdb]') && 'tmdb') || inputs.node || (contains(github.event.head_commit.message, '[wanou]') && 'wanou' || 'cheese') }}
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[tmdb]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_NODES: ${{ contains(github.event.head_commit.message, '[both-nodes]') && 'both' || '' }}
      LIVE_NODE: ${{ inputs.node || (contains(github.event.head_commit.message, '[wanou]') && 'wanou' || 'cheese') }}
      ARM_PACKAGE: 'true'
      LIVE_INSTALL_ABI: arm64-v8a
      LIVE_PREBUILT_APKS: diagnostic-apks
      LIVE_METHOD_METADATA: 'false'
      LIVE_REQUIRE_ACCEPTANCE: 'true'
      EMPTY_HOME_UI_TEST: ${{ contains(github.event.head_commit.message, '[empty-home]') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Targeted proxy unit tests and diagnostic instrumentation build
        shell: bash
        run: |
          mkdir -p evidence diagnostic-apks/arm64-v8a
          python3 -m unittest discover -s android-tv/scripts -p 'test_live_spider_error_shapes.py'
          bash android-tv/scripts/build_live_arm_canary.sh
          python3 android-tv/scripts/build_m467_spider_fixture.py
          cd android-tv
          gradle --build-cache :app:testDebugUnitTest --tests 'tv.herrin.app.nativeplayback.NativeFongMiHlsTest' --tests 'tv.herrin.app.nativeplayback.NativeFongMiProxyTest' --tests 'tv.herrin.app.SpiderProxyDiagnosticsTest' --tests 'tv.herrin.app.TvBoxSpiderBridgeTest' --tests 'tv.herrin.app.M476RemoteMediaProbeTest' --tests 'tv.herrin.app.SpiderManifestReferenceTest' --tests 'tv.herrin.app.SpiderRuntimeCompatTest'
          gradle --build-cache -PherrinLiveSourceTest=true -PherrinArmTranslationTest=true -PherrinLiveAbi=arm64-v8a :app:assembleDebug :app:assembleDebugAndroidTest
          cp app/build/outputs/apk/debug/app-debug.apk ../diagnostic-apks/arm64-v8a/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../diagnostic-apks/arm64-v8a/
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml ../evidence/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real selected Spider and production playback chain
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android-tv/scripts/run_p0_selected_nodes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-real-playback-${{ env.LIVE_NODES || env.LIVE_NODE }}-diagnostics
          path: evidence/
          retention-days: 30

  tmdb-regression:
    if: contains(github.event.head_commit.message, '[tmdb]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Build diagnostic TV test package
        run: |
          python3 android-tv/scripts/build_m467_spider_fixture.py
          cd android-tv
          gradle --build-cache :app:testDebugUnitTest --tests 'tv.herrin.app.TmdbBrowseRepositoryTest'
          gradle --build-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recheck original TMDB refresh assertion on TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android-tv/scripts/run_tmdb_refresh.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-tmdb-refresh-diagnostics
          path: evidence/
          retention-days: 30
