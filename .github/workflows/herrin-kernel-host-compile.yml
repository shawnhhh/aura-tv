name: HERRIN kernel host compile only
on:
  push:
    branches: ['codex/herrin-p0-live-playback-20261110']
    paths:
      - '.github/workflows/herrin-kernel-host-compile.yml'
      - 'android-tv/app/src/main/java/tv/herrin/app/HerrinKernelGateway.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: herrin-kernel-host-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile stable host with disabled whole-kernel entry
        working-directory: android-tv
        run: gradle --build-cache :kernel-contract:compileJava :app:compileDebugKotlin :app:compileDebugJavaWithJavac
      # No APK, emulator, real nodes, unit/TV suites or performance runs here.
