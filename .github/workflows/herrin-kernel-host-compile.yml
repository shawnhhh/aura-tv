name: HERRIN kernel host compile only
on:
  # Developer batches intentionally do not trigger full compilation on every
  # source commit. A workflow edit at the END of a batch triggers exactly one
  # host/contract validation for the current branch HEAD.
  push:
    branches: ['codex/herrin-p0-live-playback-20261110']
    paths:
      - '.github/workflows/herrin-kernel-host-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: herrin-kernel-host-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Batch-validate stable host and kernel contract only
        working-directory: android-tv
        run: gradle --build-cache :kernel-contract:check :app:compileDebugKotlin :app:compileDebugJavaWithJavac
      - name: Verify original binary build gate remains explicit
        working-directory: android-tv
        run: |
          python3 -m py_compile fongmi-kernel/verify_dependencies.py \
            fongmi-kernel/stage_dependencies.py \
            fongmi-kernel/audit_media3_candidate.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          deps = json.loads(Path('fongmi-kernel/dependencies.json').read_text())
          reviews = deps.get('media_candidate_audits', [])
          assert any(x['status'] == 'REJECTED_INCOMPATIBLE_API'
                     and x['must_not_be_staged'] for x in reviews)
          assert not deps['artifacts'], 'Unverified binaries must never be put on the actual classpath'
          print('Custom-media3 source not yet compatible; original dependency gate remains closed')
          PY
