name: HERRIN kernel host compile only
on:
  push:
    branches: ['codex/herrin-p0-live-playback-20261110']
    paths:
      - '.github/workflows/herrin-kernel-host-compile.yml'
      - 'android-tv/app/src/main/java/tv/herrin/app/HerrinKernelGateway.kt'
      - 'android-tv/app/src/main/java/tv/herrin/app/HerrinKernelRuntime.kt'
      - 'android-tv/app/src/main/java/tv/herrin/app/HerrinPlayerSession.kt'
      - 'android-tv/app/src/main/java/tv/herrin/app/HerrinKernelPages.kt'
      - 'android-tv/fongmi-kernel/adapter/src/main/java/tv/herrin/kernel/android/FongMiKernel.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: herrin-kernel-host-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile stable host with disabled whole-kernel entry
        working-directory: android-tv
        run: gradle --build-cache :kernel-contract:compileJava :app:compileDebugKotlin :app:compileDebugJavaWithJavac
      # This verifies the stable host and shared contract only. The Android
      # adapter in fongmi-kernel requires its independently locked original
      # Media3/native AAR classpath before it can be compiled. This is not
      # a whole-FongMi build or any evidence of decoded video frames.
