name: HERRIN Android TV Emulator
on:
  push:
    branches: ['feat/herrin-android-tv-m1', 'feat/herrin-m1-5-cinematic', 'feat/herrin-m2-provider-player', 'feat/herrin-m2-2-episode-resume', 'feat/herrin-m2-3-player-controls']
    paths: ['android-tv/**', '.github/workflows/android-emulator.yml']
  pull_request:
    paths: ['android-tv/**', '.github/workflows/android-emulator.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify bundled original synthetic decoder fixture
        run: |
          # Original, synthetic H.264 + bilingual AAC + WebVTT + HLS assets are
          # test-only inputs checked into androidTest/assets. Avoid flaky apt
          # mirrors; no external movie source or binary is downloaded in CI.
          test -s android-tv/app/src/androidTest/assets/synthetic.mp4
          test -s android-tv/app/src/androidTest/assets/synthetic-segment-00.ts
          grep -q WEBVTT android-tv/app/src/androidTest/assets/synthetic.vtt
          grep -q '#EXTM3U' android-tv/app/src/androidTest/assets/synthetic-hls.m3u8
          ls -lh android-tv/app/src/androidTest/assets/synthetic*
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android TV emulator (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android-tv/scripts/emulator_ci.sh
      - name: Collect emulator screenshots and UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HERRIN-emulator-evidence
          path: |
            android-tv/build/emulator-evidence/
            android-tv/app/build/reports/androidTests/
            android-tv/app/build/outputs/androidTest-results/
            android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
