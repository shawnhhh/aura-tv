name: HERRIN Android TV Emulator
on:
  push:
    branches: ['integration/herrin-m437-consumer-tv-20261029', 'feat/herrin-android-tv-m1', 'feat/herrin-m1-5-cinematic', 'feat/herrin-m2-provider-player', 'feat/herrin-m2-2-episode-resume', 'feat/herrin-m2-3-player-controls', 'feat/herrin-m4-5-catvod-spider-playback-20261027']
    paths: ['android-tv/**', '.github/workflows/android-emulator.yml']
  pull_request:
    paths: ['android-tv/**', '.github/workflows/android-emulator.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-emulator-${{ github.ref }}-${{ (github.ref == 'refs/heads/codex/herrin-p0-live-playback-20261110' || github.ref == 'refs/heads/codex/herrin-startup-source-health-20261107' || github.ref == 'refs/heads/codex/herrin-global-search-20261107' || github.head_ref == 'codex/herrin-global-search-20261107') && github.sha || 'latest' }}
  cancel-in-progress: true
jobs:
  emulator:
    # P0 pushes use the serial caller, including when its PR becomes mergeable.
    if: github.event_name != 'pull_request' || (github.head_ref != 'codex/m471-tmdb-personal-to-tvbox-playback-20261102' && github.head_ref != 'codex/herrin-responsive-config-20261106' && github.head_ref != 'codex/herrin-startup-source-health-20261107')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Acceptance APK and reports must identify the actual PR head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # This same-repository P0 PR may populate its PR-scoped dependency cache.
          # Fork PRs stay read-only; no cache is written into the base branch.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !(github.event_name == 'pull_request' && github.head_ref == 'codex/herrin-global-search-20261107' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - name: Verify bundled original synthetic decoder fixture
        run: |
          # Original, synthetic H.264 + bilingual AAC + WebVTT + HLS assets are
          # test-only inputs checked into androidTest/assets. Avoid flaky apt
          # mirrors; no external movie source or binary is downloaded in CI.
          test -s android-tv/app/src/androidTest/assets/synthetic.mp4
          test -s android-tv/app/src/androidTest/assets/synthetic-segment-00.ts
          grep -q WEBVTT android-tv/app/src/androidTest/assets/synthetic.vtt
          grep -q '#EXTM3U' android-tv/app/src/androidTest/assets/synthetic-hls.m3u8
          printf '%s\n' 'e96d3d073c466240f7a71ca7910f24f7fa08a54a879c484313513c060dacbb0e  android-tv/app/src/androidTest/assets/playback-diagnostics/baseline-72.mp4' | sha256sum --check
          ls -lh android-tv/app/src/androidTest/assets/synthetic*
      - name: Rebuild original M4.67 DEX Spider fixture
        run: python3 android-tv/scripts/build_m467_spider_fixture.py
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start controlled real SMB2 and SMB3 fixture
        run: bash .github/scripts/start_smb_fixture.sh
      - name: Test on Android TV emulator (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android-tv/scripts/emulator_ci.sh
      - name: Generate Chinese acceptance record
        if: always()
        working-directory: android-tv
        run: python3 scripts/acceptance_report.py
      - name: Collect emulator screenshots and UI test reports
        if: ${{ always() && !contains(fromJSON('["codex/herrin-global-search-20261107","codex/herrin-p0-live-playback-20261110"]'), github.head_ref || github.ref_name) }}
        uses: actions/upload-artifact@v4
        with:
          name: HERRIN-emulator-evidence
          path: |
            android-tv/build/emulator-evidence/
            android-tv/build/acceptance/
            android-tv/app/build/reports/androidTests/
            android-tv/app/build/outputs/androidTest-results/
            android-tv/app/build/outputs/apk/debug/*.apk
            android-tv/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Collect P0 reports without acceptance APKs
        if: ${{ always() && contains(fromJSON('["codex/herrin-global-search-20261107","codex/herrin-p0-live-playback-20261110"]'), github.head_ref || github.ref_name) }}
        uses: actions/upload-artifact@v4
        with:
          name: HERRIN-emulator-evidence
          path: |
            android-tv/build/emulator-evidence/
            android-tv/build/acceptance/
            android-tv/app/build/reports/androidTests/
            android-tv/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve bounded original-player baseline and lifecycle evidence
        if: ${{ always() && (github.head_ref || github.ref_name) == 'codex/herrin-p0-live-playback-20261110' }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-player-baseline
          # AGP names connected-test XMLs by device, not by test class.
          path: |
            android-tv/build/emulator-evidence/player-baseline.json
            android-tv/build/emulator-evidence/test-evidence/**/p0-baseline-*.png
            android-tv/app/build/outputs/androidTest-results/**/TEST-*.xml
          if-no-files-found: error
          retention-days: 14
