name: HERRIN P0 Retained Controlled Failure Evidence
on:
  push:
    branches: ['codex/herrin-startup-source-health-20261107']
    paths: ['.github/workflows/herrin-p0-inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HERRIN-emulator-evidence
          github-token: ${{ github.token }}
          run-id: 42358864061
          path: evidence/tv
      - name: Inspect controlled fixture recovery and cached home failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('evidence').rglob('*'):
              if not path.is_file() or path.suffix not in ('.txt','.log'):continue
              rows=path.read_text(errors='replace').splitlines()
              shown=set()
              for n,row in enumerate(rows):
                  if any(tag in row for tag in ('P0SpiderDeadlineRecoveryTest','Spider transport','Spider service','Spider bind','HerrinSpider','P0CachedHomeHeroTest')):
                      for i in range(max(0,n-2),min(len(rows),n+12)):
                          if i not in shown:print(path.name+': '+rows[i]);shown.add(i)
          PY
