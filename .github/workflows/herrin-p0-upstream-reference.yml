name: HERRIN P0 Official FongMi Reference (not acceptance)
on:
  push:
    branches: ['codex/herrin-p0-live-playback-20261110']
    paths: ['.github/workflows/herrin-p0-upstream-reference.yml', '.github/scripts/herrin_fongmi_reference.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REFERENCE_WANOU_HOME: ${{ contains(github.event.head_commit.message, '[wanou-home]') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reference UI scope regression
        run: python3 -m unittest discover -s .github/scripts -p 'test_herrin_fongmi_reference.py' -v
      - name: Fetch unmodified official release and verify published digest
        shell: bash
        run: |
          mkdir -p reference-apk reference-evidence
          curl --fail --location --proto '=https' --max-time 180 https://github.com/FongMi/Release/releases/download/5.8.7/leanback-armeabi_v7a.apk -o reference-apk/official.apk
          echo 'f633039fc94bac9897c5933c61a18aabfde3c1e95ab16b26796c84b9a35439d9  reference-apk/official.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Original client public configuration and target-only search UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/herrin_fongmi_reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-fongmi-reference-NOT-HERRIN-ACCEPTANCE
          path: reference-evidence/*.json
          retention-days: 14

