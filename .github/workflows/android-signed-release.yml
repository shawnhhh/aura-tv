name: HERRIN Android Signed Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    env:
      HERRIN_RELEASE_KEYSTORE_B64: ${{ secrets.HERRIN_RELEASE_KEYSTORE_B64 }}
      HERRIN_RELEASE_STORE_PASSWORD: ${{ secrets.HERRIN_RELEASE_STORE_PASSWORD }}
      HERRIN_RELEASE_KEY_ALIAS: ${{ secrets.HERRIN_RELEASE_KEY_ALIAS }}
      HERRIN_RELEASE_KEY_PASSWORD: ${{ secrets.HERRIN_RELEASE_KEY_PASSWORD }}
      HERRIN_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/herrin-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify all four signing secrets exist
        run: |
          test -n "$HERRIN_RELEASE_KEYSTORE_B64"
          test -n "$HERRIN_RELEASE_STORE_PASSWORD"
          test -n "$HERRIN_RELEASE_KEY_ALIAS"
          test -n "$HERRIN_RELEASE_KEY_PASSWORD"
      - name: Restore temporary signing keystore
        run: |
          printf '%s' "$HERRIN_RELEASE_KEYSTORE_B64" | base64 --decode > "$HERRIN_RELEASE_KEYSTORE_PATH"
          chmod 600 "$HERRIN_RELEASE_KEYSTORE_PATH"
      - name: Install Android SDK
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdk_manager"
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint, assemble and verify signed release
        run: |
          python3 scripts/check_static.py
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HERRIN-signed-release-apk
          path: android-tv/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
