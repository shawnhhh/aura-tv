/* iPhone Safari / GitHub Pages launch adjustments */
html{height:100%;-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:680px) and (orientation:portrait){
  body{min-height:100dvh}
  .screen{height:100dvh;min-height:570px;aspect-ratio:auto}
  .image img{object-position:61% center}
  .hero{top:28%}
  .shelves{bottom:max(4%,env(safe-area-inset-bottom));height:33%}
}
@media (orientation:landscape) and (max-height:540px){
  html,body{height:100%;min-height:0}
  .screen{width:100vw;max-width:none;height:100dvh;min-height:0;aspect-ratio:auto}
  .top{top:max(2%,env(safe-area-inset-top));left:max(3.5%,env(safe-area-inset-left));right:max(3.5%,env(safe-area-inset-right));height:29px}
  .brand{font-size:12px;letter-spacing:2px}
  .avatar{width:23px;height:23px;font-size:10px}
  .menu{position:static;max-width:67%;width:auto;flex-shrink:1;gap:0;padding:2px}
  .menu button{padding:6px clamp(5px,1.1vw,11px);font-size:10px}
  .hero{top:20%;left:5%;width:45%;max-width:440px}
  .hero h1{font-size:clamp(24px,3.8vw,40px);margin:7px 0 2px}
  .kicker{font-size:9px}
  .hero .en{font-size:9px;letter-spacing:2px}
  .hero p{font-size:10px;line-height:1.45;margin:8px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .actions{gap:7px}
  .primary,.secondary{font-size:10px;padding:7px 12px;border-radius:6px}
  .dots{bottom:39%;gap:5px}
  .dots span{width:6px;height:4px}.dots span.active{width:16px}
  .shelves{bottom:max(2%,env(safe-area-inset-bottom));left:4%;height:31%;gap:0}
  .shelf:nth-child(n+2){display:none}
  .shelfhead{margin-bottom:4px}
  .shelfhead strong{font-size:12px}
  .shelfhead small{font-size:9px}
  .tiles{gap:7px;padding-bottom:5px}
  .tile{flex-basis:clamp(110px,17vw,165px);border-radius:5px}
  .tile .label{font-size:9px;padding:10px 5px 4px}
  .modal{padding:4% 6%}
  .modal h2{font-size:clamp(25px,4vw,36px);margin:7px 0}
  .modal p{font-size:10px;line-height:1.4}
  .subnav{margin-top:10px}.subnav button{font-size:10px;padding:7px 10px}
  .field{padding:8px 11px;margin:10px 0}.results button{width:140px}
  .muted{display:none}
}

/* HERRIN : understated Apple-TV-inspired identity and boot transition */
.brand-replay{display:flex;align-items:center;gap:10px;background:transparent;padding:0;line-height:1;white-space:nowrap}
.brand-replay:hover .brand-symbol,.brand-replay:focus-visible .brand-symbol{box-shadow:0 0 0 1px #ffffffb3,0 0 18px #ffffff1b}
.brand-symbol{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid #ffffff6b;border-radius:8px;background:linear-gradient(145deg,#2a2e35,#0d1016);font-size:18px;font-weight:800;letter-spacing:-1.4px;color:#f7f7f7;transition:box-shadow .2s}
.brand-name{font-size:clamp(12px,1.38vw,19px);letter-spacing:clamp(2px,.33vw,5px);font-weight:700;color:#f6f6f8}
.avatar{font-weight:700;letter-spacing:-.8px}
.boot-splash{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 50%,#10141b 0%,#050609 68%,#020204 100%);opacity:1;visibility:visible;transition:opacity .58s ease,visibility .58s;overflow:hidden;user-select:none;-webkit-user-select:none}
.boot-splash.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
.boot-splash.is-hidden{display:none}
.boot-word{display:flex;justify-content:center;align-items:center;white-space:nowrap;line-height:1;font-size:clamp(58px,12vw,132px);font-weight:750;letter-spacing:-.03em;text-shadow:0 0 25px #ffffff0f}
.boot-char{width:.78em;margin-right:.085em;display:inline-grid;place-items:center;overflow:hidden;flex-shrink:0;will-change:width,opacity,filter,transform,margin-right;color:#f2f2f5}
.boot-char:last-child{margin-right:0}
.boot-splash.is-playing .boot-char:not(.boot-h){animation:boot-vanish .66s cubic-bezier(.65,0,.32,1) both}
.boot-splash.is-playing .boot-n{animation-delay:.50s!important}
.boot-splash.is-playing .boot-i{animation-delay:.72s!important}
.boot-splash.is-playing .boot-r2{animation-delay:.94s!important}
.boot-splash.is-playing .boot-r1{animation-delay:1.16s!important}
.boot-splash.is-playing .boot-e{animation-delay:1.38s!important}
.boot-splash.is-playing .boot-h{animation:boot-h-focus 2.5s cubic-bezier(.3,.65,.3,1) both}
@keyframes boot-vanish{0%{width:.78em;margin-right:.085em;opacity:1;transform:translateY(0) scale(1);filter:blur(0)}100%{width:0;margin-right:0;opacity:0;transform:translateY(-.18em) scale(.85);filter:blur(8px)}}
@keyframes boot-h-focus{0%,58%{transform:scale(1);filter:brightness(1)}85%{transform:scale(1.22);filter:brightness(1.12)}100%{transform:scale(1.18);filter:brightness(1)}}
@media (max-width:680px){.brand-replay{gap:6px}.brand-symbol{width:24px;height:24px;border-radius:6px;font-size:15px}.brand-name{font-size:11px;letter-spacing:2px}}
@media (prefers-reduced-motion:reduce){.boot-splash,.boot-char{animation-duration:.01ms!important;transition-duration:.01ms!important}}

const filtered=()=>category==='电影'?data.map((d,i)=>i).filter(i=>data[i].kind==='电影'):category==='剧集'?data.map((d,i)=>i).filter(i=>data[i].kind==='剧集'):category==='动漫'?[11]:category==='我的'?Array.from(saved):data.map((_,i)=>i);
function showBackground(){im.style.opacity='.45';im.onload=()=>{im.style.opacity='1'};im.onerror=()=>{im.style.opacity='0';root.style.background='#091421'};im.src=chosen===0?BASE_HERO:url(chosen);if(im.complete&&im.naturalWidth>0)im.style.opacity='1'}
function heroRender(){const d=data[chosen];hero.innerHTML=`<div class="kicker">${d.year}　·　4K　·　${d.genre}</div><h1>${d.title}</h1><div class="en">${d.en}</div><p>${d.desc}</p><div class="actions"><button class="primary" data-cmd="play">▶　立即播放</button><button class="secondary" data-cmd="detail">ⓘ　影片详情</button></div>`}
function makeTile(i){return `<button class="tile ${chosen===i?'active':''}" data-film="${i}" aria-label="${data[i].title}详情"><img src="${url(i)}" alt="${data[i].title}海报"><span class="label">${data[i].title}</span></button>`}
function render(){nav.innerHTML=categories.map(t=>`<button data-cat="${t}" aria-selected="${category===t}">${t}</button>`).join('');heroRender();showBackground();let ids=filtered();if(category==='直播'){shelves.innerHTML='<section class="shelf"><div class="shelfhead"><strong>直播电视 · 后续对接直播源</strong></div></section>';return}if(category==='我的'&&!ids.length){shelves.innerHTML='<section class="shelf"><div class="shelfhead"><strong>还没有收藏，进入影片详情可收藏</strong></div></section>';return}let rows=category==='首页'?[['继续观看',[0,1,2,3,4,5]],['热门电影',[6,7,8,9,10,11]]]:[[category==='我的'?'我的收藏':'精选'+category,ids]];shelves.innerHTML=rows.map(([label,arr])=>`<section class="shelf"><div class="shelfhead"><strong>${label}</strong><small>全部 ›</small></div><div class="tiles">${arr.map(makeTile).join('')}</div></section>`).join('')}
function overlay(){let d=data[chosen];modal.classList.add('visible');if(active==='detail'){modal.innerHTML=`<button class="close" data-cmd="back" aria-label="关闭">×</button><div class="kicker">HERRIN SELECTION</div><h2>${d.title}</h2><div class="info"><span>${d.year}</span><span>★ ${d.rating}</span><span>${d.length}</span><span>${d.genre}</span></div><p>${d.desc}</p><div class="actions"><button class="primary" data-cmd="play">▶　播放演示</button><button class="secondary" data-cmd="save">${saved.has(chosen)?'♥ 已收藏':'♡ 收藏'}</button></div><div class="subnav">${(d.kind==='剧集'?[1,2,3,4,5]:['默认线路','备用线路']).map((v,i)=>`<button data-episode="${i+1}" class="${episode===i+1?'on':''}">${typeof v==='number'?'第'+v+'集':v}</button>`).join('')}</div>`}else if(active==='play'){modal.innerHTML=`<button class="close" data-cmd="detail">×</button><div class="kicker">PLAYER PREVIEW</div><h2>▶　${d.title}</h2><p>这是播放控制界面演示，暂未对接真实视频流或 FongMi 播放器。正式 APK 接入后会在这里显示视频。</p><div class="actions"><button class="primary" data-cmd="detail">返回影片详情</button></div>`}else if(active==='search'){modal.innerHTML=`<button class="close" data-cmd="back">×</button><h2>搜索影片</h2><input id="searchInput" class="field" placeholder="搜索电影或电视剧" autocomplete="off"><div class="results" id="searchResults">${data.map((d,i)=>`<button data-film="${i}"><img src="${url(i)}" alt=""><span>${d.title}</span></button>`).join('')}</div>`;modal.querySelector('input').focus()}else if(active==='live'){modal.innerHTML='<button class="close" data-cmd="back">×</button><h2>直播电视</h2><p>此页面将对接用户配置的合法直播源。当前只是 UI 原型。</p>'}}
function dismiss(){active='none';modal.classList.remove('visible');modal.innerHTML=''}
root.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.cat){let t=btn.dataset.cat;if(t==='⌕'){active='search';overlay();return}if(t==='直播'){active='live';category=t;render();overlay();return}category=t;let ids=filtered();if(ids.length)chosen=ids[0];render();dismiss();return}if(btn.dataset.film!==undefined){chosen=+btn.dataset.film;episode=1;render();active='detail';overlay();return}if(btn.dataset.episode){episode=+btn.dataset.episode;overlay();return}switch(btn.dataset.cmd){case 'detail':active='detail';overlay();break;case 'play':active='play';overlay();break;case 'back':dismiss();break;case 'save':saved.has(chosen)?saved.delete(chosen):saved.add(chosen);overlay();break}});
root.addEventListener('focusin',e=>{let b=e.target.closest('button[data-film]');if(b&&active==='none'){chosen=+b.dataset.film;heroRender();showBackground();root.querySelectorAll('.tile').forEach(el=>el.classList.toggle('active',el.dataset.film==chosen))}});
root.addEventListener('input',e=>{if(e.target.id!=='searchInput')return;let v=e.target.value.toLowerCase();document.getElementById('searchResults').innerHTML=data.map((d,i)=>({d,i})).filter(x=>(x.d.title+x.d.en+x.d.genre).toLowerCase().includes(v)).map(x=>`<button data-film="${x.i}"><img src="${url(x.i)}"><span>${x.d.title}</span></button>`).join('')});
root.addEventListener('keydown',e=>{if(e.key==='Escape'||(e.key==='Backspace'&&e.target.tagName!=='INPUT')){dismiss();e.preventDefault();return}if(e.target.tagName==='INPUT')return;if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;let area=active==='none'?root:modal;const items=[...area.querySelectorAll('button')].filter(n=>{let r=n.getBoundingClientRect();return r.width>0&&r.height>0});let cur=document.activeElement;let cr=cur.getBoundingClientRect();let best=null,bestCost=Infinity;for(let b of items){if(b===cur)continue;let r=b.getBoundingClientRect(),x=r.left+r.width/2-(cr.left+cr.width/2),y=r.top+r.height/2-(cr.top+cr.height/2);let delta=e.key==='ArrowRight'?x:e.key==='ArrowLeft'?-x:e.key==='ArrowDown'?y:-y;let orth=e.key==='ArrowLeft'||e.key==='ArrowRight'?y:x;if(delta<5)continue;let cost=delta+Math.abs(orth)*2;if(cost<bestCost){best=b;bestCost=cost}}if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}e.preventDefault()});

// App launch: letter-by-letter collapse into H, then reveal the movie artwork.
const launchScreen=document.getElementById('launchScreen');
let launchTimer=0,launchEndTimer=0;
function endLaunch(){
 clearTimeout(launchTimer);
 if(launchScreen.classList.contains('is-hidden')||launchScreen.classList.contains('is-leaving'))return;
 launchScreen.classList.add('is-leaving');
 root.inert=false;
 launchEndTimer=setTimeout(()=>{launchScreen.classList.add('is-hidden');launchScreen.classList.remove('is-playing','is-leaving')},620);
}
function playLaunch(){
 clearTimeout(launchTimer);clearTimeout(launchEndTimer);
 launchScreen.classList.remove('is-hidden','is-leaving','is-playing');
 root.inert=true;
 void launchScreen.offsetWidth;
 launchScreen.classList.add('is-playing');
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 launchTimer=setTimeout(endLaunch,reduced?80:2850);
}
launchScreen.addEventListener('click',endLaunch);
document.getElementById('brandReplay').addEventListener('click',playLaunch);
render();
playLaunch();
</script></body></html>
