<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERRIN 局域网快速配置</title><link rel="stylesheet" href="/center.css"><main><h1>局域网快速配置</h1><p>HTTP 明文传输，仅供可信家庭局域网临时使用。配对码不能防止局域网中间人攻击。开启后最多 5 分钟，电视退出立即关闭。</p><p>仅添加和修改公开影视源。不接受账号、密码、Token、带认证信息的链接及含查询参数的地址。新 Spider 插件仍须电视单独授权。</p><button id="pair">请求电视确认</button><section id="manager" hidden><form id="primary"><label>主影视仓 HTTP(S) 地址<input name="url" type="url" required maxlength="2048"></label><button>保存并刷新电视</button></form><h2>附加影视源</h2><div id="entries"></div><form id="edit"><input name="id" type="hidden"><label>名称<input name="name" required maxlength="32"></label><label>公开 HTTP(S) 地址<input name="url" type="url" required maxlength="2048"></label><label><input name="enabled" type="checkbox" checked>启用</label><button>保存</button><button type="reset">新建</button></form><form id="batch"><label>批量地址，每行一条<textarea name="urls" required maxlength="20000"></textarea></label><button>导入</button></form><button id="end">结束会话</button></section><p id="status" role="status"></p></main><script src="/center.js"></script></html>
