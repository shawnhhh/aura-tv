<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERRIN 配置中心</title><link rel="stylesheet" href="/center.css"><main><h1>HERRIN</h1><p>手机配置中心 · 本次电视会话</p><section id="trust"><p>此服务使用临时自签名 HTTPS 证书。请在浏览器证书信息中核对 SHA-256 指纹与电视一致后再继续；无法核对时请使用电视遥控器手动配置，勿提交密码。</p><label><input type="checkbox" id="verified">已核对电视显示的完整证书指纹</label><button id="pair">请求电视确认</button></section><section id="manager" hidden><nav><button data-tab="tmdb">TMDB</button><button data-tab="sources">影视源</button><button data-tab="live">直播源</button><button data-tab="nas">NAS</button></nav><form id="tmdb"><h2>TMDB</h2><p id="endpoint"></p><label>Read Access Token<input name="token" type="password" autocomplete="off" maxlength="600"></label><p>留空保存将删除令牌。</p><button>保存</button><button type="button" id="test">测试已保存令牌</button></form><form id="sources" hidden><h2>影视源</h2><p>连接现有 TVBox 单仓 / 多仓配置地址；新 Spider 仍须电视授权。本版不提供批量地址管理。</p><label>HTTPS 配置地址<input name="url" type="url"></label><button>应用</button></form><form id="live" hidden><h2>直播源</h2><p>更新现有主直播源，不清除收藏与分组；多源编辑尚未接入。</p><label>M3U<input name="m3u" type="url"></label><label>EPG<input name="epg" type="url"></label><button>保存</button></form><form id="nas" hidden><h2>NAS · WebDAV</h2><p>现有 NAS WebDAV 槽位；不声明支持 SMB/NFS 或多 NAS 管理。</p><label>HTTPS 根路径<input name="url" type="url"></label><label>用户名<input name="username" autocomplete="off" maxlength="256"></label><label>密码<input name="password" type="password" autocomplete="off" maxlength="2048"></label><button>保存并立即应用</button></form><button id="end">结束会话</button></section><p id="status" role="status"></p></main><script src="/center.js"></script></html>
