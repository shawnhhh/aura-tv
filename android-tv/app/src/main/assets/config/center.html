<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>HERRIN</title>
<link rel="stylesheet" href="/center.css">
</head>
<body><main>
<header><h1>HERRIN</h1></header>
<section id="trust">
  <p>首次连接请核对电视上显示的 HTTPS 证书指纹。若浏览器无法验证证书，请改用电视遥控器配置，不要输入账号密码。</p>
  <label class="check"><input type="checkbox" id="verified">已核对证书指纹</label>
  <button id="pair" type="button">请求电视确认</button>
</section>
<section id="manager" hidden>
 <nav>
  <button type="button" data-tab="sources" class="selected">影视源</button>
  <button type="button" data-tab="nas">个人媒体库</button>
  <button type="button" data-tab="tmdb">海报与资料</button>
  <button type="button" data-tab="live">直播源</button>
 </nav>
 <div id="module-content">
  <div id="module-toast" role="status" aria-live="polite" hidden></div>
  <form id="sources">
   <input name="url" type="text" inputmode="url" maxlength="2048" placeholder="影视仓地址" required autocomplete="url">
   <select id="source-node" aria-label="影视节点"><option value="first">第一个节点（默认）</option></select>
   <button type="submit">应用影视源</button>
  </form>
  <section id="nas" hidden>
   <div class="toggle">
    <button type="button" data-personal-tab="WebDAV" class="selected">WebDAV</button>
    <button type="button" data-personal-tab="SMB">SMB</button>
   </div>
   <div id="personal-connections"></div>
   <form id="personal-edit">
    <input name="id" type="hidden">
    <input name="protocol" type="hidden" value="https">
    <input name="host" type="hidden">
    <input name="domain" type="hidden">
    <input name="encryption" type="hidden" value="false">
    <label>连接名称<input name="name" maxlength="64" autocomplete="off" required></label>
    <label>服务器地址<input name="address" maxlength="2048" placeholder="http:// 或 https://" autocomplete="url" required></label>
    <label id="smb-port">端口<input name="port" type="number" min="1" max="65535" placeholder="自动"></label>
    <label>路径<input name="path" maxlength="2048" placeholder="输入媒体目录路径"></label>
    <label>用户名<input name="username" maxlength="256" autocomplete="off"></label>
    <label>密码<input name="password" type="password" maxlength="2048" autocomplete="off"></label>
    <button id="personal-cancel" type="button" class="secondary" hidden>取消编辑</button>
    <button type="submit">添加</button>
   </form>
   <div id="personal-browser" hidden>
    <div id="personal-current-path"></div>
    <button id="personal-parent" type="button" class="secondary" hidden>上级目录</button>
    <div id="personal-directories"></div>
    <div class="actions">
     <button type="button" id="personal-directory-previous" class="secondary" hidden>上一页</button>
     <button type="button" id="personal-directory-next" class="secondary" hidden>下一页</button>
    </div>
   </div>
  </section>
  <form id="tmdb" hidden>
   <input name="token" type="password" autocomplete="off" maxlength="600" placeholder="TMDB Token">
   <button type="submit">刮削</button>
  </form>
  <form id="live" hidden>
   <input name="m3u" type="url" placeholder="M3U / TXT / TVBox 地址" required>
   <input name="epg" type="hidden">
   <button type="submit">应用直播源</button>
  </form>
 </div>
 <button id="end" type="button" class="secondary">结束会话</button>
</section>
<div id="status" role="status" aria-live="polite"></div>
</main><script src="/center.js"></script></body></html>
