pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Verified original AAR binaries are staged as immutable Maven artifacts.
        // AGP rejects direct local AAR dependencies in an Android library.
        maven { url = uri(file('build/locked-original-maven')); content { includeGroup 'tv.herrin.original' } }
        google(); mavenCentral(); maven { url = 'https://jitpack.io' }
    }
    versionCatalogs { libs { from(files('../vendor/fongmi-core/upstream/gradle/libs.versions.toml')) } }
}
rootProject.name = 'herrin-fongmi-kernel'
include ':contract', ':catvod', ':core', ':adapter'
project(':catvod').projectDir = file('../vendor/fongmi-core/upstream/catvod')
// Original independently buildable runtime bridges. The full player dependency
// gate does not block these source builds, nor are they bundled as fake runtimes.
['quickjs', 'nodejs', 'thunder', 'chaquo'].each { module ->
    include ":${module}"
    project(":${module}").projectDir = file("../vendor/fongmi-core/upstream/${module}")
}
