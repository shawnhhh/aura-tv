plugins { alias libs.plugins.android.library }

def upstream = file('../../vendor/fongmi-core/upstream')
def externalLibraries = providers.gradleProperty('fongmiLibraries').map { file(it) }

android {
    namespace = 'com.fongmi.android.tv'
    compileSdk = libs.versions.compileSdk.get().toInteger()
    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        consumerProguardFiles upstream.toPath().resolve('app/proguard-rules.pro').toFile()
        buildConfigField 'String', 'APPLICATION_ID', '"tv.herrin.app"'
        buildConfigField 'String', 'VERSION_NAME', '"5.8.7-herrin-integration"'
        buildConfigField 'int', 'VERSION_CODE', '587'
        buildConfigField 'String', 'FLAVOR', '"leanback"'
        manifestPlaceholders.runtimeCatalog = 'https://github.com/FongMi/Release/releases/download/module/catalog.json'
        javaCompileOptions.annotationProcessorOptions.arguments += [
            'room.schemaLocation': layout.buildDirectory.dir('schemas').get().asFile.toString(),
            'eventBusIndex': 'com.fongmi.android.tv.event.EventIndex'
        ]
    }
    buildFeatures { buildConfig = true; viewBinding = true }
    sourceSets.main {
        // Whole source trees, including upstream engine implementations. No
        // fake Media3 API or playback algorithm is supplied by this build.
        java.srcDirs = [new File(upstream, 'app/src/main/java'), new File(upstream, 'app/src/leanback/java')]
        res.srcDirs = [new File(upstream, 'app/src/main/res'), new File(upstream, 'app/src/leanback/res')]
        assets.srcDirs = [new File(upstream, 'app/src/main/assets')]
        aidl.srcDirs = [new File(upstream, 'app/src/main/aidl')]
        jniLibs.srcDirs = [new File(upstream, 'app/src/main/jniLibs')]
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    lint { disable 'UnsafeOptInUsageError'; disable 'ExpiredTargetSdkVersion' }
}

configurations.configureEach {
    exclude group: 'stax', module: 'stax-api'
    exclude group: 'xpp3', module: 'xpp3'
    exclude group: 'com.android.support'
    resolutionStrategy.force libs.okhttp
}

dependencies {
    api project(':catvod')
    // Upstream local libraries are not silently replaced by Maven stock Media3.
    implementation fileTree(dir: new File(upstream, 'app/libs'), include: ['*.aar'])
    if (externalLibraries.isPresent()) api fileTree(dir: externalLibraries.get(), include: ['*.aar'])
    implementation libs.appcompat
    implementation libs.lifecycle.service
    implementation libs.media
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.rtmp.client
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable
    implementation libs.leanback
    implementation libs.androidautosize
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    coreLibraryDesugaring libs.desugar
}
