plugins { id 'java-library' }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.register('checkCutoverContract', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'tv.herrin.kernel.KernelCutoverContractCheck'
}
tasks.named('check').configure { dependsOn 'checkCutoverContract' }
tasks.register('checkDispatchContract', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'tv.herrin.kernel.KernelDispatchContractCheck'
}
tasks.named('check').configure { dependsOn 'checkDispatchContract' }
